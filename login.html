<!DOCTYPE html>
<html>
<head>
<title>Login - Smart Neo Baby Care</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
} */
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;

    /* 🔥 Background Image */
    background: url('/images/bg3.jpg') no-repeat center center fixed;
    background-size: cover;

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.login-card {
    background: white;
    padding: 35px;
    width: 350px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

/* Title */
.login-card h2 {
    margin-bottom: 20px;
    color: #2193b0;
    position: relative;
    z-index: 1;
}
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.4); /* dark effect */
    z-index: -1;
}

/* Input */
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
}

/* Focus effect */
input:focus {
    border-color: #2193b0;
    outline: none;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border: none;
    background: #2193b0;
    color: white;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #176d85;
}

/* Password message */
#message {
    display:none;
    text-align: left;
    font-size: 13px;
    margin-top: 10px;
}

.valid { color: green; }
.invalid { color: red; }

.valid:before { content: "✔ "; }
.invalid:before { content: "✖ "; }

/* Footer */
.footer {
    margin-top: 15px;
    font-size: 13px;
}

.footer a {
    color: #2193b0;
    text-decoration: none;
}
</style>
</head>

<body>
<div class="overlay"></div>

<div class="login-card">

    <h2>👶 Smart Neo Login</h2>

    <form action="/login" method="POST">

        <input type="email" name="email" placeholder="📧 Email" required>

        <input type="password" id="psw" name="password"
        placeholder="🔒 Password"
        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
        required>

        <button type="submit">🚀 Login</button>

    </form>

    <div id="message">
        <p id="letter" class="invalid">Lowercase letter</p>
        <p id="capital" class="invalid">Uppercase letter</p>
        <p id="number" class="invalid">Number</p>
        <p id="length" class="invalid">Minimum 8 characters</p>
    </div>

    <div class="footer">
        New user? <a href="/register">Register</a>
    </div>

</div>

<script>
var myInput = document.getElementById("psw");
var letter = document.getElementById("letter");
var capital = document.getElementById("capital");
var number = document.getElementById("number");
var length = document.getElementById("length");

myInput.onfocus = function() {
    document.getElementById("message").style.display = "block";
}

myInput.onblur = function() {
    document.getElementById("message").style.display = "none";
}

myInput.onkeyup = function() {

    var lowerCaseLetters = /[a-z]/g;
    if(myInput.value.match(lowerCaseLetters)) {
        letter.classList.add("valid");
        letter.classList.remove("invalid");
    } else {
        letter.classList.add("invalid");
        letter.classList.remove("valid");
    }

    var upperCaseLetters = /[A-Z]/g;
    if(myInput.value.match(upperCaseLetters)) {
        capital.classList.add("valid");
        capital.classList.remove("invalid");
    } else {
        capital.classList.add("invalid");
        capital.classList.remove("valid");
    }

    var numbers = /[0-9]/g;
    if(myInput.value.match(numbers)) {
        number.classList.add("valid");
        number.classList.remove("invalid");
    } else {
        number.classList.add("invalid");
        number.classList.remove("valid");
    }

    if(myInput.value.length >= 8) {
        length.classList.add("valid");
        length.classList.remove("invalid");
    } else {
        length.classList.add("invalid");
        length.classList.remove("valid");
    }
}
</script>

</body>
</html>
