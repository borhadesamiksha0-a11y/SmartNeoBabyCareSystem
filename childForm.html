
<!DOCTYPE html>
<html>
<head>
    <title>Child Health Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
        } */
         body {
    font-family: 'Poppins', sans-serif;
    margin: 0;

    /* 🔥 BACKGROUND IMAGE */
    background: url('images/bg.jpg') no-repeat center center fixed;

    /* 🔥 MAKE IMAGE COVER FULL SCREEN */
    background-size: cover;
}


        .navbar {
            background: #2193b0;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .container {
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .form-card {
            width: 700px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2193b0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        textarea {
            grid-column: span 2;
        }

        .full {
            grid-column: span 2;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: #2193b0;
            color: white;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .section-title {
            margin-top: 20px;
            font-weight: 600;
            color: #444;
        }
    </style>
</head>

<body>

<div class="navbar">
    👶 Smart Neo Baby Care
    <span>Child Dashboard</span>
</div>

<div class="container">
    <div class="form-card">

        <h2>Child Health Form</h2>

        <!-- ✅ IMPORTANT: enctype must be present -->
        <form action="/childForm" method="POST" enctype="multipart/form-data">

            <!-- Basic -->
            <div class="section-title">Basic Information</div>
            <div class="grid">
                <input type="text" name="name" placeholder="Child Name" required>
                <input type="number" name="age" placeholder="Age" required>
            </div>

            <!-- Parents -->
            <div class="section-title">Parent Details</div>
            <div class="grid">
                <input type="text" name="father_name" placeholder="Father Name" required>
                <input type="text" name="mother_name" placeholder="Mother Name" required>
            </div>

            <!-- Personal -->
            <div class="section-title">Personal Details</div>
            <div class="grid">
                <input type="date" name="dob" required>

                <select name="gender" required>
                    <option value="">Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                </select>

                <select name="blood_group" class="full" required>
                    <option value="">Blood Group</option>
                    <option>A+</option><option>A-</option>
                    <option>B+</option><option>B-</option>
                    <option>O+</option><option>O-</option>
                    <option>AB+</option><option>AB-</option>
                </select>
            </div>

            <!-- Health -->
            <div class="section-title">Health Information</div>
            <div class="grid">
                <input type="number" step="0.1" name="height" placeholder="Height (cm)" required>
                <input type="number" step="0.1" name="weight" placeholder="Weight (kg)" required>
            </div>

            <!-- Profile Photo -->
            <div class="section-title">Profile Photo</div>
            <div class="grid">
                <input type="file" name="profile_photo" accept="image/*">

                <img id="preview" 
                     style="width:120px;height:120px;border-radius:10px;display:none;">
            </div>

            <!-- Address -->
            <div class="section-title">Address</div>
            <div class="grid">
                <input type="text" name="city" placeholder="City" required>
                <input type="text" name="taluka" placeholder="Taluka" required>
                <input type="text" name="district" placeholder="District" required>
                <input type="text" name="state" placeholder="State" required>
            </div>

            <!-- Symptoms -->
            <div class="section-title">Symptoms</div>
            <textarea name="symptoms" placeholder="Symptoms..." required></textarea>

            <!-- ✅ Symptom Photos (FIXED NAME) -->
            <div class="section-title">Upload Symptom Photos (Max 5)</div>
            <input type="file" name="symptom_photos" multiple accept="image/*">

            <!-- Preview -->
            <div id="previewContainer" style="display:flex;gap:10px;flex-wrap:wrap;"></div>

            <br>
            <button type="submit">💾 Save & Analyze</button>

        </form>

    </div>
</div>

<script>
function previewImage(event) {
    const img = document.getElementById("preview");
    img.src = URL.createObjectURL(event.target.files[0]);
    img.style.display = "block";
}

// ✅ FIXED MULTIPLE PREVIEW
document.querySelector('input[name="symptom_photos"]').addEventListener("change", function(event) {
    const container = document.getElementById("previewContainer");
    container.innerHTML = "";

    const files = event.target.files;

    if (files.length > 5) {
        alert("Max 5 images allowed");
        event.target.value = "";
        return;
    }

    for (let file of files) {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.style.width = "100px";
        img.style.height = "100px";
        img.style.borderRadius = "10px";
        container.appendChild(img);
    }
});
</script>

</body>
</html>
