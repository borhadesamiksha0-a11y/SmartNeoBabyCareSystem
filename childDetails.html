<!DOCTYPE html>
<html>
<head>
    <title>Child Details</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: url('/images/bg2.jpg') no-repeat center center/cover;
            height: 100vh;
        }

        .overlay {
            background: rgba(0,0,0,0.5);
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 800px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 25px;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
        }

        .profile {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .profile img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
        }

        .details p {
            margin: 5px 0;
        }

        .section {
            margin-top: 20px;
        }

        .photos img {
            width: 100px;
            height: 100px;
            margin: 5px;
            border-radius: 10px;
        }

        .back-btn {
            margin-top: 20px;
            padding: 10px;
            border: none;
            background: #2193b0;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="overlay">
    <div class="card">

        <h2>👶 Child Full Details</h2>

        <div class="profile">
            <img id="photo" src="">
            
            <div class="details">
                <p><b>Name:</b> <span id="name"></span></p>
                <p><b>Father:</b> <span id="father"></span></p>
                <p><b>Mother:</b> <span id="mother"></span></p>
                <p><b>DOB:</b> <span id="dob"></span></p>
                <p><b>Gender:</b> <span id="gender"></span></p>
                <p><b>Blood:</b> <span id="blood"></span></p>
            </div>
        </div>

        <div class="section">
            <h3>Health Info</h3>
            <p><b>Age:</b> <span id="age"></span></p>
            <p><b>Height:</b> <span id="height"></span></p>
            <p><b>Weight:</b> <span id="weight"></span></p>
            <p><b>Symptoms:</b> <span id="symptoms"></span></p>
        </div>

        <div class="section">
            <h3>📸 Symptom Photos</h3>
            <div class="photos" id="photos"></div>
        </div>

        <div class="section">
            <h3>📍 Address</h3>
            <p id="address"></p>
        </div>

        <button class="back-btn" onclick="goBack()">⬅ Back</button>

    </div>
</div>

<script>

// ✅ GET ID FROM URL
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

// ✅ FETCH SINGLE CHILD DATA
fetch("/api/child/" + id)
.then(res => res.json())
.then(data => {

    document.getElementById("name").innerText = data.name;
    document.getElementById("father").innerText = data.father_name;
    document.getElementById("mother").innerText = data.mother_name;
    document.getElementById("dob").innerText = data.dob;
    document.getElementById("gender").innerText = data.gender;
    document.getElementById("blood").innerText = data.blood_group;

    document.getElementById("age").innerText = data.age;
    document.getElementById("height").innerText = data.height + " cm";
    document.getElementById("weight").innerText = data.weight + " kg";
    document.getElementById("symptoms").innerText = data.symptoms;

    document.getElementById("address").innerText =
        data.city + ", " + data.taluka + ", " + data.district + ", " + data.state;

    document.getElementById("photo").src =
        data.profile_photo ? "/uploads/" + data.profile_photo : "";

    // ✅ SHOW PHOTOS
    if (data.symptom_photos) {
        const photos = JSON.parse(data.symptom_photos);
        let html = "";

        photos.forEach(p => {
            html += `<img src="/uploads/${p}">`;
        });

        document.getElementById("photos").innerHTML = html;
    }

});

// back button
function goBack() {
    window.location.href = "doctorDashboard.html";
}

</script>

</body>
</html>
